services:
  backend:
    build: ./backend
    ports: ['8000:8000']
    env_file: ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports: ['3000:3000']
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_started
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: trading, POSTGRES_PASSWORD: trading_dev, POSTGRES_DB: trading}
    ports: ['5432:5432']
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U trading -d trading']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 2s
